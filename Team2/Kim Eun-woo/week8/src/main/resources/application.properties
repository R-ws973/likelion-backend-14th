spring.application.name=week8

# ===== MySQL DataSource =====
# 미리 MySQL Workbench 등에서 데이터베이스(스키마)를 먼저 생성해 두세요.
#   CREATE DATABASE likelion DEFAULT CHARACTER SET utf8mb4;
spring.datasource.url=jdbc:mysql://localhost:3306/likelion?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=3124
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
# create: 실행마다 테이블 새로 생성(기존 데이터 삭제) / update: 변경분만 반영(데이터 유지)
spring.jpa.hibernate.ddl-auto=update
# 실행되는 SQL을 콘솔에 출력 (학습용)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
